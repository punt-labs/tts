context: |
    M3 of vox-ck3w (branch feat/vox-enable-disable, already checked out). The
    enable/disable core (M2) is merged into the branch and accepted: the marker is
    <repo>/.punt-labs/vox/enabled. Read the design docs/vox-enable-disable.md §3.5
    (the gate) and §2.7 of ../punt-kit/standards/tool-enable-disable.md.

    Today vox's plugin session hooks fire in every project the plugin is installed
    in. This mission makes them per-repo opt-in: the audio hooks gate on the marker,
    so vox is silent in a repo until `vox enable` has been run there. This is the
    behavior change that makes enablement meaningful — it is intended.

    Note: hooks/session-start.sh already carries the Skill(enable)/Skill(disable)
    permission additions from M2; you do not need to add them, only leave
    session-start UNGATED. This mission touches only hooks/ (+ tests). It does NOT
    touch install.sh (M4) or any src/. Do NOT push, open a PR, run make install, or
    restart the daemon. Submit via ethos mission result.
