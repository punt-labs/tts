          status: pass
      prose: |
        Gated the seven audio/narration session hooks on the per-repo enabled
        marker per design vox-enable-disable.md §3.5 and standard
        tool-enable-disable.md §2.7. Each hook, after extracting cwd from stdin,
        resolves the repo root:

          _repo_root=$(git -C "$_cwd" rev-parse --show-toplevel 2>/dev/null) || _repo_root="$_cwd"
          [ -f "$_repo_root/.punt-labs/vox/enabled" ] || exit 0
          command -v vox >/dev/null 2>&1 || exit 0

        git rev-parse falls back to the hook cwd outside a git worktree and never
        errors. The gate REPLACES the retired vox.md/vox.local.md config-presence
        check — keeping it would keep firing audio in a disabled repo whose config
        is left dormant.

        Scope note on the hook set: the mission named notify.sh, signal.sh,
        notify-permission.sh. signal.sh does not exist; the real audio session
        hooks are the seven gated here (notify, notify-permission, acknowledge,
        vibe-nudge, pre-compact, farewell, subagent) — exactly the group the
        existing test _SCRIPTS tuple tracks. Design §3.5 gates "vox's plugin
        session hooks"; gating only three would leave the other four firing off
        dormant config after `disable`. session-start.sh and suppress-output.sh
        stay ungated so the slash commands and mic MCP tools remain available to
        run `vox enable` in a not-yet-enabled repo.

        Touched only hooks/ and tests/. No src/, no install.sh.
