context: |-
    Phase 1.5 of the Audio Programs epic (vox-ys1p). Phase 1 (the format-agnostic
    Program state machine in src/punt_vox/voxd/programs/) is BUILT. This mission
    DESIGNS the tidy of the MUSIC command surface so podcast and audiobook later
    copy a clean, consistent pattern. Design only -- write to
    docs/audio-programs-music-tidy.md; do NOT change production code.

    Read: docs/audio-programs-concept.md (the "Phase 1.5" paragraph and the
    "Decisions ... 2026-07-25" section), then src/punt_vox/cli_music.py,
    src/punt_vox/server.py (music, music_play, music_new, music_next, music_list),
    src/punt_vox/server_audio_tools.py, src/punt_vox/types_programs/prompts.py
    (PromptSet), catalog_gateway.py, client_catalog_gateway.py, __main__.py.

    Operator decisions (2026-07-25) the design MUST honor: (1) one PromptSet built
    by both the CLI and the MCP tool, sent to the daemon; (2) MCP tools mirror the
    CLI -- one tool per group named for the group, the subcommand as an argument,
    not one tool per subcommand, uniform across groups; (3) the CLI reads authored
    input from stdin, add `vox music on`, no --file flag; (4) --json works in every
    position on the music subcommands.

    Invariants: voxd holds the ElevenLabs key and generates; the CLI and MCP server
    are thin clients; playback is free. NO state-machine change (surface and wiring
    only), so no z-spec. No migration or compatibility shims (forward integration).
