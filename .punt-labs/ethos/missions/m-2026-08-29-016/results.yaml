      open_questions:
        - 'Blocker (operator action): ELEVENLABS_API_KEY lacks the convai_write permission. Fix: ElevenLabs dashboard -> API keys -> enable Conversational AI write on this key (or issue a new key) and update the keychain entry the repo .envrc reads. Re-probe: POST /v1/convai/tools should stop returning 401.'
      prose: |
        The spike harness is complete, committed (5 commits on
        spike/vox-bst7-el-convai), ruff-clean under the repo config, and
        verified offline end-to-end. What cannot exist yet are the real
        measured numbers: the workspace ElevenLabs API key is scoped for TTS
        only, and the very first control-plane call (client-tool creation)
        requires convai_write. Escalating rather than working around, per the
        contract.

        Ready to run the moment the key is rescoped, in order:
          uv run setup_agent.py          # creates 3 client tools + agent
          uv run run_automated.py --smoke
          uv run run_automated.py        # 3 seed sizes, ~27 tool invocations
        then REPORT.md fills in from results/metrics_<ts>.json.

        Measurement design (validated by the dry run): per invocation the
        harness records exec_ms, handling_ms (call received -> result sent),
        total_ms (call received -> next agent progress event), and
        overhead_ms = total_ms - exec_ms, the EL-attributable round trip the
        1.5s gate applies to. The dry run surfaced and fixed a real artifact:
        when the agent runs two of our tools in parallel, the faster tool's
        next-event gap measures our own slow tool, so such invocations are
        flagged is_clean: false and excluded from the gate metric.

        The live-mic entry point (run_live.py) is built and documented in the
        README with the barge-in playbook; it logs the timestamped event
        trace (turn boundaries, tool start/end, interruption,
        agent_response_correction) the "barge-in preserves state" verdict
        needs. The live session itself is post-mission, leader + operator.

        Note on authorship: the three test_*.py files were contributed into
        the shared worktree by a teammate (they arrived while round 1 was in
        flight); they pass against my modules and I adopted and committed
        them with the harness.

        Artifacts: spikes/vox-bst7-el-convai/REPORT.md (verdict lines PENDING
        with the exact blocker), results/trace_dry_run.jsonl, README.md run
        instructions.
