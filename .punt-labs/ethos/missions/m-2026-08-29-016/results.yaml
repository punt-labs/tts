      prose: |
        Round-2 verdict for DES-069's two kill criteria:

        1. "p95 tool round-trip < 1.5s: PASS (measured 993ms)" — overall
           clean-overhead p95, n=27, real WAN (ping RTT 64-254ms during the
           runs). Per tool: clock p95 127ms, search_code p95 993ms,
           write_note p95 993ms. The metric excludes our own deliberate tool
           sleep and excludes co-scheduled invocations whose next-event gap
           measures our slow tool rather than EL (is_clean flag; design
           validated by the teammate's pins).

        2. "barge-in mid-tool-call preserves state: PENDING LIVE TEST" — the
           instrumented entry point (run_live.py) and the playbook (README,
           "Live run") are ready; the live session is leader + operator,
           post-mission, per contract.

        Seed push: EL took a 50KB prompt override without complaint — no
        rejection, no truncation, no connect penalty. Quality note for
        DES-070: at 50KB gemini-2.0-flash drifted toward narrating tool
        intent instead of folding results back in; 1KB and 10KB stayed crisp.

        The real WebSocket matched the mock-tested protocol exactly (init
        handshake, client_tool_call/client_tool_result, ping/pong,
        agent_response) — zero protocol surprises, zero code changes needed
        between the offline dry run and the live API. One control-plane
        finding: agent deletion propagates lazily, so tool deletion straight
        after 409s "still in use"; teardown now force-deletes and treats 404
        as done.

        Phase A (review-fix) was completed before any billed call: all six
        findings fixed, all 4 TDD pins green. Suite tally: 35 passed / 35
        collected (leader quoted 36 — the on-disk suite collects 35; flagged
        for tests-bst7 to confirm nothing is missing).

