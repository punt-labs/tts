success_criteria:
    - 'Build a spike harness under spikes/vox-bst7-el-convai/ that validates ElevenLabs Conversational AI as the E+ voice-agent LLM host per DES-069 (DESIGN.md ~line 3431) and bead vox-bst7. This is throwaway spike code: it must NOT touch src/, tests/, pyproject.toml, or uv.lock. Prefer self-contained PEP 723 uv scripts (inline dependencies) so the punt-vox package and make check are untouched. Spike code still gets full type annotations and ruff-clean style, but no OO-ratchet ceremony and no test suite is required for the harness itself.'
    - 'Client tools (criterion a): register exactly 3 client tools on an EL Conv AI agent session via the WebSocket client-tools primitive (tool schemas declared at session start; client_tool_call events answered with client_tool_result on the same socket, per DES-069): (1) a fast tool that returns in <50ms locally (e.g. echo/clock), (2) a slow tool that takes 2-5s locally (simulating search_code against a large tree), (3) a write_note-style tool that persists its argument to a file in the spike dir and returns an ack.'
    - 'Conversation + latency (criteria b, c): drive at least one 5-turn conversation in an automated mode that needs no human audio (text input or pre-synthesized utterances), eliciting at least 20 tool invocations total across the 3 tools over the run(s). Measure per-invocation tool round-trip (client_tool_call received -> client_tool_result acknowledged/next agent event) and report p50/p95/max per tool and overall, as both a machine-readable metrics JSON and a human-readable table. The acceptance gate is overall p95 < 1.5s under real WAN conditions from this laptop to EL cloud.'
    - 'Seed push (criterion f): parameterize the agent system prompt / conversation seed size and run at least 3 sizes (roughly 1KB, 10KB, 50KB of realistic session-context text) recording per-size: session-start latency, first-response latency, and a brief qualitative note on response quality/degradation. Record where (if anywhere) EL rejects or truncates the seed.'
    - 'Live mode (criteria d, e — harness only, not the live run): provide a live-mic entry point that the operator can run from a terminal (real microphone + speaker audio) for barge-in-during-tool-call and turn-taking tests. Instrument it to log a timestamped event trace (turn boundaries, tool call start/end, interruption events, conversation state before/after barge-in) so the live session with the operator produces machine evidence, not just impressions. Document exact run instructions in the spike README. The live run itself happens after this mission closes, driven by the leader with the operator — do not attempt to test barge-in without a human.'
    - 'Report: write spikes/vox-bst7-el-convai/REPORT.md containing the measured p50/p95/max latency tables, the seed-size findings, environment notes (network, EL model/agent config used), and an explicit verdict line for each of the two kill criteria from DES-069: "p95 tool round-trip < 1.5s: PASS/FAIL (measured X)" and "barge-in mid-tool-call preserves state: PENDING LIVE TEST" with the event-trace instructions for filling it in.'
    - 'Secrets: read the ElevenLabs API key from the environment (it is provided by the repo .envrc). Fail fast with a clear one-line error if it is absent. Never print, log, or write the key. Conv AI usage costs real credits: keep automated runs to the minimum that yields >=20 tool invocations and 3 seed sizes; do not loop unbounded.'
    - Commit incrementally -- one commit per logical step (file group, single concern, or single PR-equivalent slice). Each commit must pass `make check`. Do not accumulate more than 30 minutes of uncommitted changes.
    - Do not open a PR, create branches, or push. Work on the existing branch spike/vox-bst7-el-convai in the worktree named in context. Submit your result via `ethos mission result` when the harness runs end-to-end in automated mode and REPORT.md carries real measured numbers, citing the metrics JSON path and REPORT.md.
