        - 'Noted, not fixed: two concurrent panel pushes can still land a stale *render* if the later-read scene acquires the lock first. This is pre-existing (the old show-only code had the same interleaving), it is transient, and it is self-correcting -- see the prose for why the lock makes it benign where the diff corruption was not.'
      prose: |
        All six findings addressed. The must-fix was real; I reproduced it before
        fixing it and the regression test fails on the unlocked code.

        THE RACE, CONFIRMED AND CHARACTERISED. I read both sides rather than taking
        it on report. `PanelPush.install`/`refresh` mutated `LiveScene._previous`
        synchronously and then awaited `push.apply` separately, and
        `VoxPanelLeg._start` (leg.py:132) hands every menu click (`_on_callback`,
        :126) and every control event (`_on_event`, :130) to a bare
        `asyncio.create_task` with no ordering. Two pushes therefore interleave.

        The reviewers described a stale read; the consequence is worse than that,
        and worth recording because it is what makes the fix non-optional. If the
        second push's `update` reached luxd before the first's `show`, luxd rejected
        the patch (unknown scene), the fallback installed v2, and then the first
        push's `show` landed v1. The screen then held v1 while `PanelPush` believed
        v2 was installed -- and every later diff was computed against v2. A field
        differing between v1 and v2 but not between v2 and v3 would never be sent
        again. Nothing heals it, because each subsequent push is locally consistent.
        The old `show`-on-every-push code could not exhibit this at all: it
        repainted the whole tree every time, so any divergence lasted one event.

        FIX. An `asyncio.Lock` spans plan-and-apply in both verbs -- deliberately not
        merely around the plan, since the window is the await between claiming a
        render and landing it. I corrected the module docstring, which asserted the
        opposite ("needs no lock: every push runs on the panel leg's event loop").
        One event loop is not one at a time, and that sentence would have talked the
        next reader out of the lock.

        I chose the lock over the generation-counter alternative: a counter detects
        the stale plan after the fact and still has to decide what to do about it,
        whereas the lock makes the stale plan unrepresentable. Deadlock is not
        reachable -- nothing inside `_complete` re-enters `PanelPush`, and
        `PatchScene`'s install fallback constructs a fresh `InstallScene` rather than
        calling back through this object.

        REGRESSION TEST, FALSIFIED FIRST. A gated client parks the first push inside
        its `show`. The assertion is that while it is parked the second push has
        touched the client *not at all*. I removed the lock and confirmed the test
        fails with `['show', 'update']` -- the second push's diff going out against a
        scene luxd had never seen -- then restored it. A second test pins the
        resulting order (show, then a patch carrying the field that actually differs
        from the render that landed).

        AUDITED THE MUSIC SIDE RATHER THAN ASSUMING IT. I assert in the new docstring
        that `LuxScenePublisher` needs no such lock, so I checked: `composition.py`
        builds one publisher and spawns one `run()` task inside the TaskGroup;
        `run()` awaits `_publish` to completion before the next `get()`; and
        `_live` is touched only from `_publish`. The subscription's task reaches the
        publisher only through `submit`/`reinstall`, which are synchronous and touch
        the mailbox alone. Serialized by construction, confirmed.

        STILL PRESENT, DELIBERATELY: two concurrent pushes can land a stale *render*
        -- task A reads settings v1, task B reads v2, B takes the lock first, so the
        screen ends on v1. Three reasons I left it. It is pre-existing (the old
        show-only path had the identical interleaving). It is self-correcting, and
        provably so now: because plan-and-apply are atomic under the lock,
        `_previous` always equals what landed last, so the next push diffs correctly
        and converges -- which is exactly the invariant that was broken before. And
        the only fix is to move the render inside the lock, which means handing
        `PanelPush` a `Callable[[], RenderRequest]` and coupling it to the service's
        rendering. Worse shape for a transient one-frame staleness the next control
        event corrects.

        THE FIVE CHEAP ONES. Comment moved to the line that actually establishes the
        table's field ordering (the spread, not `rows`), and it now says what breaks
        if it moves. `runtime_checkable` dropped from `ScenePush`, with the reason it
        was wrong rather than merely unused recorded so it does not come back.
        Duplicate element ids now fail toward install like the neighbouring
        unaddressable-element guard, with a test. `AlbumRoster.albums` derived once
        in the constructor. `SceneMailbox.get` records the cross-module invariant it
        depends on.

        Skipped item 8 (the PY-TS-14 nit) per your ruling, and left CHANGELOG.md
        alone. Two commits, `make check` green on both, full suite green.
