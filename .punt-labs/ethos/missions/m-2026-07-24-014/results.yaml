      prose: |
        Step 3 of 3 (MCP parity) for vox-jei3 is code-complete on feat/vox-jei3-impl
        (commit 76da5f7). The mic surface exposes the recordings-store and
        catalog-authoring verbs at parity with the vox rec/music CLI. Each tool is a
        thin bound method on a _RecTools / _MusicCatalogTools humble object that
        delegates to the same VoxClientSync engine op its CLI twin uses — one code
        path, no reimplemented logic; containment and audit stay daemon-side.

        Forward integration: the record tool became rec_new and returns the bare store
        id (no daemon path), with no compat alias. Agent-facing get forms: rec_get
        returns the recording bytes (base64) since an MCP caller has no shell CWD;
        music_get exports the multi-part album to an agent-named destination and
        returns the locator.

        Extracting the tools into humble objects improved server.py on method_ratio,
        class_to_func_ratio, avg_params, avg_complexity, public_names, and avg_lcom;
        module_size and classes_per_module grew to carry the 8 verbs and are
        scope-relaxed. Not pushed; no PR; make install / daemon restart not run
        (daemon-dependent verbs were surface-verified against in-memory clients, not
        exercised end-to-end).
