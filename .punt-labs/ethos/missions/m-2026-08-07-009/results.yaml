        Built the vox-panel applet as a new src/punt_vox/panel package: topics.py
        (PanelTopic StrEnum), radio_control.py (RadioSpec/RadioControl for the
        Notifications and Mic Mode radios), voice_control.py (combo + glyph-only
        preview button, grouped columns), panel_scene.py (assembles the RenderRequest
        with auto_resize framing), state.py (PanelState, reads via VoiceRoster/
        SettingsSource protocols), service.py (VoxPanelService -- applies control
        events through the existing ConfigStore.write_field and VoxClientSync
        RPCs the CLI/MCP tool already use), leg.py (VoxPanelLeg), program.py
        (VoxPanelProgram), and applet.py (VoxPanelApplet + the vox-panel Typer
        entry point). ports.py defines the Protocols (HubListener, PanelRestClient,
        SettingsSource, VoiceRoster, SettingsStore, PanelDaemonClient) that make
        every collaborator swappable in tests.

        Two design deviations from the literal contract wording, both necessary
        and documented in code:

        1. punt_lux.applets' AppletLeg is @final with no subscribe() hook --
           it only dispatches menu-callback clicks over its own private
           LuxHubClient, and AppletProgram is typed against the concrete AppletLeg,
           not a Protocol. Reusing it literally was impossible without modifying
           lux (out of scope). VoxPanelLeg is built from the same public primitives
           AppletLeg itself composes (LuxRestClient.for_identity + .listener()),
           with subscribe(*topics) called before listen() on the identical leg
           that serves the menu callback, per the confirmed single-channel design.
           VoxPanelProgram mirrors AppletProgram's run() logic exactly, typed
           against the punt_lux.applets.claim.AppletClaim and
           punt_lux.applets.watch.SessionEnd Protocols so real SessionClaim/
           SessionWatch/NoClaim/NoSession instances satisfy it structurally.

        2. "existing VoxClientSync RPCs (notify/speak/voice)" -- notify, speak,
           and voice are durable ConfigStore fields (DURABLE_KEYS), not daemon
           RPCs; VoxClientSync only exposes voices() and synthesize() as real
           RPCs. VoxPanelService writes notify/speak/voice via
           SettingsStore.write_field (the same path the CLI and MCP tool use)
           and calls VoxClientSync.synthesize() only for the voice preview
           button and .voices() for the roster -- this is what "the existing
           RPCs the CLI and MCP tool already use" actually resolves to in the
           codebase.

        The preview button commits nothing itself: ButtonClicked events carry no
        payload, so it replays the currently-held (already-committed) voice via
        synthesize() rather than an unsaved combo selection.

        Coupling: VoxPanelService originally defaulted its client/store
        constructor arguments internally (VoxClientSync()/ConfigStore(...)),
        pushing its efferent coupling to 8 internal modules over the PL-CU-1
        guideline of 7. Made both parameters mandatory and moved the default
        construction to applet.py's _leg_for (the composition root), cutting
        service.py to 5. applet.py's small resulting complexity/size growth
        (max_complexity 2->3, module_size 85->90) is scoped-relaxed in
        .oo-baseline.json with an inline justification per the ratchet policy;
        it remains well under all absolute thresholds.

        make check-oo and make check-coupling both pass directly. Note: make
        check's dependency chain (lint type docs test check-oo check-coupling
        check-suppressions) never reaches check-oo/check-coupling in this repo
        right now because `uv run pytest` fails on one test unrelated to this
        mission: tests/test_hook_gate.py::TestHookGate::
        test_git_unavailable_and_no_marker_is_silent. It fails because an
        untracked .punt-labs/vox/enabled marker (dated before this mission,
        outside my write-set/extract_into) sits in a parent directory of the
        test's TMPDIR-rooted sandbox, so the test's "no marker in any parent"
        scenario finds a real marker. Reproduces identically with none of my
        changes present; not touched, not in scope.

        Commits landed on local main (not a feature branch) per the mission-loop
        split -- branch creation, PR, and push are the leader's responsibility,
        not the worker's.
