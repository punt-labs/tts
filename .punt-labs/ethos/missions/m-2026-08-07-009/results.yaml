        All five round-2 findings addressed:

        1. CRITICAL frame sizing -- panel_scene.py drops frame.flags.auto_resize
           for an explicit FrameSpec(size=(340, 240)), within the confirmed
           330-350 x 220-260 range. Docstring rewritten to explain why (the
           section labels render as ImGui separator_text, which always spans the
           full available width by design, defeating auto_resize's width
           computation). tests/panel/test_panel_scene.py added: asserts frame.
           flags is None, frame.size is set and within range, and the status
           line renders the same shape whether silent or carrying a notice.

        2. CRITICAL concurrency race -- VoxPanelService gained a threading.Lock
           guarding every _state/_notice read-modify-write (_commit, refresh,
           recover_from_write_failure, _preview's failure path, and scene()'s
           read). tests/panel/test_service.py::TestConcurrentApplyEvent proves
           it: one thread is parked mid-write via a blocking store double, a
           second thread's write on a DIFFERENT field is shown to block (not
           race ahead) while the first holds the lock, and after both finish the
           final state carries BOTH updates.

        3. CRITICAL silent config-write failure -- VoxPanelService.apply_event
           no longer swallows OSError; it propagates to the caller so a write
           failure is never confused with a payload-validation failure.
           leg.py's _apply now has two distinct except clauses -- (TypeError,
           ValueError) logs "rejected control event" and drops the change;
           OSError logs "could not persist the %s change; correcting the scene"
           and calls the service's new recover_from_write_failure(field), which
           re-reads the real settings from disk/voxd and sets a PanelNotice so
           the re-pushed scene both reverts to the true value and tells the user
           why. Covered by test_leg.py's write-failure test and test_service.py's
           recover_from_write_failure/propagation tests.

        4. HIGH invisible outages -- new HubOutageLog class turns leg.py's every-
           2-second hub-retry tick from all-DEBUG into WARNING on the first tick
           of an outage, INFO restatement every 30s while it continues, and DEBUG
           for every other tick; a successful connect clears it so the next
           outage logs at WARNING again. Wired into both HubUnavailableError
           sites in _listen_once and the re-push site in _apply.
           test_hub_outage_log.py covers the escalation directly;
           test_leg.py::TestOutageLogging covers it wired into the leg via caplog.

        5. HIGH preview/refresh swallow everything identically -- VoxPanelService
           narrowed _preview()'s and the new _resync() helper's except clause
           from bare Exception to VoxdConnectionError (the actual voxd-down
           exception type; VoxdProtocolError and any other bug now propagate to
           the outer ERROR-logging boundary in leg.py). PanelScene gained a
           status/notice TextElement (PanelNotice, a Null Object mirroring the
           existing PlaybackNotice pattern in music_player) so stale/failed
           state is visually distinct from live. Covered by
           test_service.py::test_voice_preview_lets_a_real_bug_propagate,
           test_a_real_bug_in_the_roster_read_propagates, and the panel_notice/
           panel_scene tests.

        MEDIUM (distinct log messages) -- done as part of item 3: the two except
        clauses in leg.py's _apply now have distinct, accurate messages
        ("rejected control event" vs "could not persist the ... change;
        correcting the scene").

        6. HIGH silent hook skip -- hooks/session-start.sh's vox-panel spawn
           block restructured so entering it depends only on the enabled marker;
           inside, a missing vox-panel on PATH now writes a line to the same
           PANEL_LOG the spawn/reuse paths already use, instead of silently
           doing nothing. Verified live: an enabled repo with vox-panel removed
           from PATH produces a log line naming the reason; a non-enabled repo
           still produces zero log noise (unchanged).

        OO/coupling: two files exceeded their existing baseline on unavoidable,
        review-mandated growth (leg.py's new HubOutageLog wiring and distinct
        except clauses; service.py's lock, PanelNotice, and the refresh/recover
        split). Both scoped-relaxed in .oo-baseline.json with inline
        justifications citing the specific finding driving the growth; all
        metrics remain far under their absolute thresholds. panel_scene.py's
        module_size similarly relaxed for the mandated status-line addition.
        make check-oo and make check-coupling both pass cleanly after the
        relax + update-oo.

        Commits landed on branch feat/vox-panel (created by the leader between
        round 1 and round 2), two commits for this round: one for the five
        source-level fixes, one for the session-start.sh fix and all new/updated
        tests. I did not push or open a PR, per the mission instructions.
