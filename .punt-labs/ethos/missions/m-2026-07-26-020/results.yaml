        - name: regression test test_unlink_race_filenotfound_does_not_leak_absolute_path asserts the race wire frame carries no /Users/ prefix, no leading /, no Errno, and audits as a fault not a rejection
          status: pass
        - name: 'paydown -- collapsed four except clauses to one + extracted _reply_failure staticmethod: rec_handlers max_complexity 5->4, avg_complexity 2.5->2.4 IMPROVED; static keeps it out of LCOM'
          status: pass
        - name: 'runtime demo -- store not-found (filename None) verbatim; race (in-jail filename) wire ''recordings/foo.mp3: no such file or directory'', abs path only in log'
          status: pass
      prose: |
        Round-2 review fixes, one green commit (2fdb4b8) on fix/vox-a7dd.

        (1) BLOCKING baseline gap. wire_fault.py was in neither baseline -- round
        1's make update-oo ran before the file was committed, so git-diff scoping
        missed it, and my earlier "green" was stale. Both baselines now carry
        wire_fault.py. I verified make check EXITS 0 on a clean tree at HEAD (git
        status clean of tracked source/test/baseline files; only ethos session
        artifacts remain, which the gate excludes): ruff, mypy, pyright,
        markdownlint, 3219 tests, OO ratchet PASS, coupling PASS, suppressions -5.

        (2) REAL LEAK at rec_handlers.py. The FileNotFoundError clause preceded the
        OSError->fault branch and sent str(exc) verbatim. record_store.remove's
        synthesized "no recording named X" has filename=None (the client's own ref
        -- verbatim is correct), but the TOCTOU unlink race raises a raw OS
        FileNotFoundError with filename=<absolute store path>, leaking the
        username-bearing prefix. Fixed by collapsing the four except clauses into
        one `except (ValueError, OSError)` and extracting a _reply_failure
        staticmethod that discriminates: ValueError or filename-None
        FileNotFoundError -> reply.error(str(exc)) (verbatim rejection); everything
        else -> reply.fault(SafeFault.from_exception(exc)). A regression test drives
        the race and asserts the wire frame has no absolute prefix, no leading '/',
        no "Errno", and audits as a fault.

        The extraction is a genuine paydown, not just a relax: rec_handlers
        max_complexity improved 5->4 and avg_complexity 2.5->2.4. Making
        _reply_failure a staticmethod (it touches no instance state) keeps it out of
        the LCOM computation, so cohesion did not regress and PLR6301 stays clean.
        Only avg_params (+0.1) and module_size (+8) were relaxed with a one-line
        justification -- the unavoidable growth of adding the discrimination method.
