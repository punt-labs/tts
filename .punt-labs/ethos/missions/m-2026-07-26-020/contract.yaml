context: |
    Implement bead vox-a7dd (branch fix/vox-a7dd, already checked out) per the
    ratified design docs/wire-host-info-boundary.md — read S1.1 (the helper) and
    S2.6 (the fault contract) first. This is the FIRST and foundational bead of the
    vox-93ej trust-boundary epic; four sibling beads build on the helper.

    Two deliverables:

    (a) relativize_to_data_root(path) -> (label, relpath) | None — a new
    wire-boundary helper (S1.1). Two data roots: state = paths.user_state_dir()
    (~/.punt-labs/vox), output = dirs.default_output_dir() (VOX_OUTPUT_DIR or
    ~/Music/vox). Resolve both roots and the candidate with .resolve() BEFORE
    comparing, so a symlink or ..-bearing path cannot appear in-jail when it is
    not — the same containment discipline ContainmentRoot already applies to
    inbound names. In-jail returns (label, path-relative-to-root); under neither
    root returns None.

    (b) WireReply fault contract (S2.6). Today WireReply.error/fault send the
    message VERBATIM on the wire while only sanitizing the log record, so 10
    str(exc) sites leak an absolute prefix with the username. Rebuild the wire
    message from the exception's own fields:
      rel = relativize_to_data_root(exc.filename)
      if rel is not None:  wire = f"{rel.path}: {exc.strerror.lower()}"
      else:                wire = "operation failed"
    and always log the raw str(exc) via logger.exception. Convert every site in the
    S2.6 table: cache_handlers.py:55,89; rec_handlers.py:103; record_handler.py:136,
    145; chunked_fetch.py:152,162; speech_handlers.py:212,217,229; play_handler.py:95.
    Client-rejection ERROR frames that echo the client's OWN input (a hostile ref,
    an unknown chime signal, "unknown message type") stay verbatim — the attacker
    supplied the value; it is not host recon.

    You decide the helper's module placement within the admitted paths and follow
    the OO rules. The design doc is on your branch uncommitted; commit it as part of
    the work (fix any markdownlint). Do NOT push, open a PR, run make install, or
    restart the daemon — the leader handles verification and the PR. Submit via
    ethos mission result.
