      prose: |
        Round 2 addresses djb's sole remaining finding (MEDIUM ReDoS).
        Commit 6e707ac: SafeText.of previously ran the super-linear _ABSOLUTE_PATH
        pattern on the raw uncapped input and capped only the output after re.sub. A
        crafted 200k-char many-segment string backtracks O(n^2) (djb measured 133s),
        which on the daemon's single event loop is worse than the raise a7dd guards
        against. The fix caps the input first -- _ABSOLUTE_PATH.sub(_rewrite_token,
        cls._capped(raw, cap)) -- bounding the scan to cap chars, self-contained and
        independent of any caller's input discipline, which is also what D4 "cap the
        length" intends. A load-bearing docstring records why (a future reader must
        not revert to capping only the output). Two regression tests: the 200k-char
        input returns in < 1s and completes; a capped input still sanitizes the
        in-jail path within the first cap chars. The docstring grows the new-on-branch
        wire_text.py to 67/300 (far under threshold) -- one scoped relax, justified in
        .oo-audit.jsonl. No push, no PR, no make install (leader owns those).
