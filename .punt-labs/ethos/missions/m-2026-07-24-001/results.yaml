      prose: |
        Daemon + client + transport layer of vox-jei3 across 5 commits (SHAs
        7268ff1, 880ac8d, 9ee8673, de855d3, 82d1f1f). Chunked fetch replaces the
        700KB single-frame cap outright on the daemon (no size-limited daemon path
        left). New wire ops rec_list, rec_remove, music_new, music_manifest,
        music_remove reuse the DES-049 containment (extracted to ContainmentRoot) and
        vox-1hbo WireReply audit logging. music_new parks a fresh single-track album
        via the normal AlbumId/catalog machinery without disturbing the Program;
        music ops catalog-resolve by AlbumId (never a path segment). Client methods on
        both VoxClient and VoxClientSync; fetch converted to chunked reassembly with
        ordered/total/sha verification and atomic album writes. Feature-driven
        module_size/LCOM growth on touched files is scope-relaxed with per-file
        justification in the audit; record_store and fetch_handler carry genuine
        complexity/size paydown.
