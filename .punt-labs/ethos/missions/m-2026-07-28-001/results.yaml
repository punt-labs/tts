        .<host>.punt-import.lock, never the target -- reusable by the later
        settings.json writer), and the existing AtomicFile.

        The old GlobalClaudeImports carried a multi-import managed SECTION; the bare
        line model is single-line-bound, so the import line binds at construction
        (matching biff's ClaudeMdImport reference). VoxGuidance and its tests updated
        forward.

        One commit: the writer swap is a single rollback-coherent unit -- deleting the
        markers, rewriting claude_md, adding the two collaborators, and updating
        callers/tests are mutually dependent, so no intermediate state is independently
        green. Ratchet state (.oo-baseline.json, .oo-audit.jsonl,
        .oo-coupling-baseline.json, .oo-coupling-audit.jsonl) is staged in the same
        commit (not listed above -- repo-root artifacts outside the write_set).

