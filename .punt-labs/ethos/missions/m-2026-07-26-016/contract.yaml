context: |
    Bug vox-suvs (branch fix/vox-suvs, already checked out): `vox cache status` and
    `vox cache clear` operate on the CLIENT's local cache dir, not the daemon's.

    Current: cache_status_cmd / cache_clear_cmd (__main__.py ~865, ~885) call
    cache.cache_status() / cache.cache_clear() directly, reading/clearing the local
    CACHE_DIR (~/.punt-labs/vox/cache). But the cache is DAEMON-owned — voxd
    reads/writes it during synthesis (voxd/synthesis.py). On a remote daemon
    (VOXD_HOST set) these commands hit the CLIENT's cache; the daemon's real cache
    on the remote host is untouched — `cache clear` silently no-ops and
    `cache status` reports the wrong (client) numbers.

    Goal: route cache status/clear through the daemon so they operate on the
    DAEMON's cache, honoring VOXD_HOST/PORT/TOKEN — exactly as `vox status`,
    `vox voices`, and the music/rec commands already do.

    The design is SETTLED: copy the vox-tnum daemon-handler template — the
    rec_list / rec_remove wire ops registered in voxd/handler_registry.py, their
    handler (voxd/rec_handlers.py), and the matching VoxClientSync methods. Add two
    wire ops, cache_status and cache_clear, with a daemon-side handler that runs
    cache.py's cache_status/cache_clear on the daemon's own cache, and add the
    cache_status() / cache_clear() methods to VoxClient and VoxClientSync. Repoint
    cache_status_cmd / cache_clear_cmd at the client methods; the CLI must no longer
    import or call cache.py's local functions.

    You decide the exact write-set within the admitted paths — which handler module,
    the wire type definitions, the client method signatures. Follow the established
    rec_* template and the OO rules (behavior with its data, tell-don't-ask, Literal
    wire tags, illegal states unrepresentable). Do NOT prescribe a shape I did not
    ask for; the reply shapes simply mirror cache.py's current return values.

    Verification is the leader's job — do NOT push, open a PR, run make install, or
    restart the daemon. Submit your result via `ethos mission result`.
