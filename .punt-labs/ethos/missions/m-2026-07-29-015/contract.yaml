success_criteria:
    - Implement PHASE 2 of the voxd Music Player — the interactive layer — per the MERGED design docs/vox-music-player.md (§5 phase 2, §3.1 phase-2 modules) and the FINALIZED Z model docs/vox-music-player.tex (the LuxListener machine, fork (B)). Phase 1 (the scene push + change-signal) is already merged on main and present on this branch; build ON it.
    - 'The settled lux interface (do NOT reopen — pinned via the current 2abf64b pin, lux #294, and the button→publish shape from ping #3): (a) IDENTITY+LEASE — construct the client with an EXPLICIT identity: LuxRestClient.for_identity(ClientIdentity(kind=''app'', name=''voxd'', lease_ttl=30)) (all public punt_lux exports; this also closes bead vox-hrjx — replace the phase-1 connect() context-derivation). (b) MENU — client.register_callback(id, label) for the ''Music'' entry (renders as ''voxd ▸ Music''). (c) LISTEN — the LuxHubClient listener / subscribe(topics) loop: subscribe to music.play + music.stop; inbound arrive as EventFrame{topic, payload}, menu callbacks as CallbackFrame{callback_id}; one outbound WebSocket, blocking receive loop with automatic reconnect. (d) BUTTONS — AlbumListScene emits Play/Stop ButtonElements WITH the publish attribute, verbatim: Play row {"kind":"button","id":"play-<album_id>","label":"Play","publish":{"topic":"music.play","payload":{"album_id":"<album_id>"}}}; Stop {"kind":"button","id":"stop","label":"Stop","publish":{"topic":"music.stop"}}.'
    - 'New modules (design §3.1 phase 2): player_events.py — PlayAlbum(album_id) / StopMusic, a discriminated union, each with apply(service) (polymorphic dispatch, NOT PY-DP-8) mapping to ProgramService.replay_album / off. lux_subscription.py — the persistent LuxHubClient listen/subscribe loop + the ~30s lease (renewed on any authenticated contact). MusicPlayer dispatches an inbound event via event.apply(service); the phase-1 change-signal then re-pushes the scene.'
    - 'Honor the Z model''s invariants (docs/vox-music-player.tex LuxListener, fork (B)) and assert them BY NAME in tests: at-most-one live subscription/connection; an event received while subscribed dispatched exactly once; GAP-BOUNDED buffering (buffered clicks drain in order on reconnect PROVIDED reconnect precedes lease expiry; past expiry discarded — luxd sweeps the buffer, so voxd does NOT rely on surviving state); lease renewed on contact, expires after lease_ttl with no contact; each music.play/music.stop maps to exactly one playback transition. RESTART is register-FRESH not resume: on reconnect after a drop/expiry, re-identify (same deterministic identity), re-register ''Music'', re-subscribe, re-push the scene — depend on NO surviving Hub state.'
    - 'Build against the CURRENT 2abf64b pin (identity/lease/menu/listener APIs are on lux #294; the button→publish is a dict voxd constructs). Unit tests use fakes (a fake LuxHubClient / listener) and must pass in CI — do NOT require a running luxd for the test suite. The END-TO-END live-verify (a real click on the display → music.play → voxd.replay_album) is GATED on lux PR-3 (which lands luxd''s Hub-side publish handler + the publish-attribute validation) — do NOT attempt it now; state in your result that it is pending the PR-3 pin bump, and provide the strongest offline substitute (assert the emitted scene''s Play/Stop button dicts carry the exact publish attribute, and that a synthesized EventFrame{music.play,{album_id}} dispatches to replay_album).'
    - make check green (incl. check-oo, check-coupling, check-suppressions). After the LAST commit that adds any new file, run make update-oo + make update-coupling, then make check on a CLEAN tree (git stash unrelated dirt) exits 0. Commit incrementally — one commit per logical step, each passing make check; never >30 min uncommitted. CHANGELOG [Unreleased] entry. Do NOT push, do NOT open a PR, do NOT bump the punt-lux pin (the leader bumps it to the PR-3 merge separately). Submit via ethos mission result; flag any design gap or fork for the leader.
