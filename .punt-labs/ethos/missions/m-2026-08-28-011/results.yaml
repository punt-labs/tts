      open_questions:
        - 'Undeclared path (write-set deviation, leader-approved): tests/test_cli_desktop.py (+102 lines) carries this round''s regression test. tests/test_cli_desktop.py is not in this contract''s write_set (same file used for the round-1 LOW-fix tests under the same approval). To be recorded via a single `ethos mission correct` after close, covering both m-2026-08-28-005 and this mission.'
      prose: |
        Fixed the docstring/mkdir-ordering bug silent-failure-hunter found during
        leader verification of round 1: DesktopCli.install()'s docstring claims
        every prerequisite resolves before any disk write, but audio_dir.mkdir()
        ran before _resolve_installer(), so a no-credentials refusal (expected,
        already tested) left a stray empty directory -- contradicting a docstring
        claim that predates this whole branch (present since commit 1035782).

        Reordered so _resolve_installer() runs before audio_dir.mkdir() --
        _resolve_installer only records audio_dir on the installer, it never
        needed the directory to exist, so the reorder is free. Added
        test_no_refusal_creates_anything_on_disk, parametrized over all three
        refusal causes (missing uvx, unsupported platform, no credentials),
        asserting neither the output directory nor the XDG root appears on disk.
        Verified the guard is real by reverting the fix and watching it fail,
        then restoring it and watching it pass.
