success_criteria:
    - 'Follow-up to escalated mission m-2026-08-28-005 (same ticket, vox-1gub), which added Linux support to DesktopInstaller.config_path() and made it raise ValueError on unsupported platforms. CRITICAL fix (this mission''s core task): doctor.py:291 check_claude_desktop() calls config_path() bare and now crashes with an uncaught ValueError/traceback on an unsupported platform where it previously degraded gracefully to "Claude Desktop config: not found". Catch ValueError there and emit CheckResult.of(OPTIONAL, ..., required=False) naming the unsupported platform, matching the sibling precedent at src/punt_vox/service/installer.py:106-115 (detect_platform() raises SystemExit, Typer renders it cleanly).'
    - 'NOTE -- __main__.py is OUT OF SCOPE for this mission: the same crash exists in _desktop_registration() (__main__.py:744, reached by `vox status`), but src/punt_vox/__main__.py is currently write-set-locked by an unrelated open mission (m-2026-08-22-056, Conversation Mode Slice 1b). That fix is tracked separately as bead vox-i9ee and will be picked up once the lock clears. Do not touch __main__.py in this mission.'
    - 'MEDIUM fix: XDG_CONFIG_HOME handling in desktop_install.py (around line 121, `Path(os.environ.get("XDG_CONFIG_HOME") or "~/.config").expanduser()`) does not reject relative paths per the XDG basedir spec ("if an implementation encounters a relative path in any of these variables it should consider the path invalid and ignore it"). Treat a non-absolute XDG_CONFIG_HOME as unset -- fall back to ~/.config -- instead of resolving it against the process cwd. Verify the existing tilde-path test in tests/test_desktop_install.py still passes, and add a test asserting a relative XDG_CONFIG_HOME is treated as unset.'
    - 'LOW fix: cli_desktop.py''s _write_config (extracted in the prior mission) does a non-atomic whole-file truncate+rewrite of claude_desktop_config.json, a file shared with other MCP servers'' secrets in their env blocks. Write to a sibling temp file in the same directory and os.replace() to swap it in. Also: when the parent directory does not yet exist, create it 0700 and the file 0600 (matching the real Claude Desktop app''s permissions) instead of the current 0755/0644 defaults.'
    - Add test coverage for `vox doctor`'s check_claude_desktop() on a simulated unsupported platform (tests/test_doctor.py) -- this exact gap (doctor.py had zero coverage of the unsupported-platform path) is why the CRITICAL finding shipped in round 1 undetected.
    - Commit incrementally -- one commit per logical step (file group, single concern, or single PR-equivalent slice). Each commit must pass `make check`. Do not accumulate more than 30 minutes of uncommitted changes.
    - Do not open a PR. Submit your result via `ethos mission result` when make check is green and tests pass, citing file:line for each of the three fixes (CRITICAL/MEDIUM/LOW) and the new test coverage.
