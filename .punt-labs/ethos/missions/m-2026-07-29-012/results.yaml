        - 'Six scoped ratchet relaxations (each justified in the audit logs), all genuine feature substance vs origin/main: OO module_size on catalog.py/service.py/daemon.py (the change-signal seam + drain-task wiring) and OO+coupling on the two new music_player files ports.py/lux_scene_publisher.py (the LuxRenderer Protocol, which are new vs origin/main so not real regressions). The genuine paydown is control_channel.py: extracting ModeTransitionLog dropped its max_complexity 4->3 and its LCOM.'
      prose: |
        Phase 1 of the voxd music player, push-only, against the merged design. The
        player is a projection of voxd's one active source onto the vox.music lux
        scene, plus a voxd-internal change signal that keeps it truthful.

        New package src/punt_vox/voxd/music_player/: PlayerView (the Z-modelled
        projection; I1/I2/I3 enforced in its constructor so an inconsistent view
        cannot be built), AlbumListScene (pure (albums, view) -> RenderRequest, no
        I/O), SceneMailbox (latest-wins one-slot), LuxScenePublisher (drains the
        mailbox and renders off-thread via asyncio.to_thread so a slow luxd never
        stalls the event loop; HubUnavailable/OpError logged and dropped, never
        raised), MusicPlayer (the ChangeListener), MusicPlayerSubsystem (composition),
        and ports.py (PlayerService / ScenePublisher / LuxRenderer Protocols so the
        player and publisher are tested with fakes and the final LuxRestClient stays
        out of the publisher's contract).

        Change signal (programs/): ChangeListener Protocol + ChangeSignal PubSub.
        ProgramService owns one ChangeSignal and attaches it to the control channel
        (fires after each applied command, inside the single-writer, serialized with
        the state it reports) and the catalog (fires after each new/remove). The
        MANDATORY non-blocking property holds: _notify_change only builds the scene
        and submits it to the latest-wins mailbox; the blocking PUT runs on the
        publisher's own task. Proven by tests (a down/slow renderer never blocks the
        emit path or the event loop) and by the live-verify.

        Genuine OO paydown on a touched file: the generate-Program mode-transition
        logging was extracted from ControlChannel into a cohesive ModeTransitionLog,
        dropping the channel's max_complexity 4->3 and its LCOM while it took on the
        change-signal emit.

        Reused voxd's existing playback primitives entirely (replay_album/off/status/
        catalog_albums, the remove guard) — the player owns no new playback machinery.
        No phase-2 code (no player_events, no lux_subscription, no menu callback, no
        subscribe loop).

        Live-verify against a running luxd (port 8430, a display connected): the real
        projection path pushed vox.music and returned SceneShown(kind=ok); inspect_scene
        (GET /scenes/vox.music) reported the display-rendered tree — header "## Music",
        now-line "▶ Techno Mix — 2 of 3", Stop control, and two rows
        (music.row.aa11bb marked "▶ Techno Mix" as playing; music.row.cc22dd
        "Ambient Drift" unmarked), each with its Play button (music.play.<id>).

        Not pushed, no PR opened, per instruction.
