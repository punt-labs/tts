success_criteria:
    - 'Implement PHASE 1 of the voxd Music Player per the MERGED design docs/vox-music-player.md — §3.1 the new music_player package (player.py, player_view.py, scene.py, lux_scene_publisher.py), §3.2 the ProgramService ChangeListener PubSub seam + _notify_change firings, §3.3 wiring, §5 (phase 1). The design''s write-set (§9 phase 1) is your guide. NO phase-2 code: no player_events.py, no lux_subscription.py, no menu callback, no subscribe loop.'
    - 'Build against the now-PUBLIC LuxRestClient — `from punt_lux import LuxRestClient` (merged to lux main, lux PR #292; also RenderRequest/RenderTableRequest/SceneShown/Pong/OpError/HubUnavailableError; no display extras). Resolve the punt-lux dependency in pyproject.toml to the version/source that actually exports LuxRestClient — a released punt-lux if one has it, else a git pin to lux main until lux cuts a release. Verify `from punt_lux import LuxRestClient` imports in the vox venv; if only a git-main pin works, use it and flag it. Identity is built-in (kind=app, name=voxd) — no identity handling. Never raw REST.'
    - 'MANDATORY async re-push (design §3.2, the evaluator''s refinement): _notify_change() fires inside the ControlChannel single-writer, so it must NOT perform the lux PUT synchronously — a slow or unreachable luxd must never stall the playback control loop. _notify_change only BUILDS the scene and hands it to an async publish task via a latest-wins one-slot mailbox (coalesce to newest); LuxScenePublisher drains it on its own task, where a lux timeout / HubUnavailable is logged and dropped, never propagated into audio control. Prove it with a test: a down or slow lux client does not block the single-writer / control loop.'
    - 'Change-signal keeps the scene truthful: _notify_change fires after each applied command (in the single-writer, serialized with the state it reports), after auto-advance on track-end (the playback loop), and after a catalog mutation (new/remove). MusicPlayer registers one ChangeListener; on notify it reads status() + catalog_albums(), builds PlayerView + AlbumListScene, and enqueues the push. AlbumListScene is a pure (albums, view) -> Scene projection with no I/O.'
    - 'TDD, and assert the modeled invariants BY NAME from docs/vox-music-player.tex: I1 (at most one album playing), I2 (now-playing present iff playing), I3 (a played album is catalogued / a playing album cannot be removed). Also test: the scene projection (element tree for a known catalog + view), the change-signal firing on each surface, and the non-blocking re-push. Tests mirror each new module (PL-BS-6). The player owns NO new playback machinery — reuse ProgramService.replay_album/off/status/catalog_albums (do not reimplement).'
    - 'LIVE-VERIFY before submitting (WORKFLOW.md audio/visual gate): lux is agent-verifiable by design. With a running luxd, drive the real path — the daemon pushes the vox.music scene — and confirm via lux introspection (the lux scene inspector / inspect_scene) that the album-list + now-playing rendered with the correct data (correct albums, correct now-playing). Paste the introspection evidence in your result. If luxd cannot be run in your environment, say so explicitly and provide the strongest substitute (a captured SceneMessage asserted against the expected element tree).'
    - make check green (incl. check-oo, check-coupling, check-suppressions). After the LAST commit that adds any new file, run make update-oo + make update-coupling, confirm the new modules are in both baselines, then make check on a CLEAN tree (git stash unrelated dirt) exits 0. Commit incrementally — one commit per logical step, each passing make check; never more than 30 minutes uncommitted. Add a CHANGELOG [Unreleased] entry. Do NOT push, do NOT open a PR. Submit via ethos mission result; flag any design gap or fork for the leader.
