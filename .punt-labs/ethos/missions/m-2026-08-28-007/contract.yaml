context: |-
    vox-h777: two defects in the vox Lux music widget (docs/architecture.tex four-surface model; punt_lux SceneOperations at ../lux/src/punt_lux/operations/scenes.py).

    Defect 1 (confirmed root cause): src/punt_vox/voxd/music_player/album_display.py — AlbumDisplay.track_count reads album.manifest.parts, a frozen creation-time snapshot (src/punt_vox/voxd/programs/catalog.py). Parts are generated in the background after the album is minted, so the count is stuck at mint-time (0) forever. Catalog already exposes album.read()/ready_parts() for live counts — AlbumDisplay bypasses both. Meanwhile the widget's live playback-position line (now_playing_block.py) correctly reads live ProgramStatus via player_view.py — a different, correctly-live path. Two data sources, one frozen, feeding one widget.

    Defect 2 (mechanism identified, fix direction open): src/punt_vox/voxd/music_player/lux_scene_publisher.py always calls the lux client's scene.show()/render() on every refresh (track change, part-generated, etc). In punt_lux, show()/render() always flows through Hub-side upsert_scene_in_frame (scene_replica.py), which raises/focuses/unminimizes the frame whenever a scene id is new to its frame -- gated on frame bookkeeping surviving between pushes (frame TTL, reconnect, etc can make it look new again). punt_lux also exposes scene.update() (element-level patches via HubSceneWriter.apply) which NEVER touches upsert_scene_in_frame or any frame/focus/tab state at all -- it is architecturally the correct call for refreshing an already-open, still-live widget. vox never calls update() anywhere today.

    Both defects live on the same applet-refresh path (src/punt_vox/panel/applet.py builds the element tree; lux_scene_publisher.py pushes it), so this is one PR.
