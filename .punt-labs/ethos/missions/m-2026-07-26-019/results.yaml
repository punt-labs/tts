          added: 90
          removed: 70
      evidence:
        - name: reframed invariant §1 as a conceptual chroot; updated predicate to relativeToDataRoot
          status: pass
        - name: specified the relativize_to_data_root(path) boundary helper and the two labeled roots (state / output)
          status: pass
        - name: reclassified in-jail path leaks DROP->RELATIVIZE (cache_status.path, record.path, last_playback.file, MCP status log, doctor dirs)
          status: pass
        - name: improved the systemic fault fix to build from exc.filename relativized + exc.strerror with a generic fallback
          status: pass
        - name: re-scoped beads
          status: pass
        - name: recorded D1-D5 as settled in §6; scrubbed the banned term load-bearing (grep exit 1)
          status: pass
      prose: |
        Round 2 folds in the operator's chroot ruling and rmh's cross-surface REVISE.
        Design only, no code.

        Invariant reframed: the daemon is conceptually chrooted to its data root; a
        path crosses relative to that root, the absolute prefix never does. The
        predicate is now forall p in paths(frame): p = relativeToDataRoot(p). Two
        labeled roots confirmed against source -- state = ~/.punt-labs/vox (holds
        cache/, recordings/, logs/vox.log; paths.py) and output = VOX_OUTPUT_DIR /
        ~/Music/vox (dirs.py:86-93). One helper relativize_to_data_root(path) at the
        wire boundary resolves both roots and the candidate, returns (label, relpath)
        in-jail or None out-of-jail; it is bead #0, the shared dependency.

        Most former DROPs are now RELATIVIZE: cache_status.path -> cache, record.path
        -> recordings/foo.mp3, last_playback.file -> relative, MCP status log ->
        logs/vox.log + healthy/degraded, doctor output/music dirs -> relative.
        Out-of-jail host facts stay verdict-only: player_binary, audio_env, provider,
        versions, hostname. The systemic fault fix improves from generic to
        exc.filename-relativized + exc.strerror ("recordings/foo.mp3: permission
        denied"), generic fallback only for an unrelativizable filename or non-OSError;
        raw str(exc) still to the log.

        rmh's REVISE confirmed against client.py: CacheStatus.from_wire does
        require_str("path") (client.py:101) and record() reads terminal["path"] into
        RecordResult.store_path (client.py:67,709). Beads #2/#3 re-scoped to daemon +
        client.py + CLI in lockstep; §2.3 no longer claims name+bytes replaces the
        locator, and §7 no longer calls #2/#3 shippable without a socket.

        D1-D5 recorded as settled in §6. Banned term "load-bearing" scrubbed.
        Revised doc: docs/wire-host-info-boundary.md.
