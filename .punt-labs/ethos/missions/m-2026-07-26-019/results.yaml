          status: pass
        - name: identified systemic fault-frame path leak (10 str(exc) sites send verbatim on the wire)
          status: pass
        - name: specified Category-B fixes (doctor verdicts, status log health, vox-log INFO floor, cache_status.path)
          status: pass
        - name: flagged additional leaks (record.path, WS health diagnostic block, play stderr, program-status reason)
          status: pass
        - name: listed 5 operator decisions and a 10-item bead-ready fix list
          status: pass
      open_questions:
        - 'D1: drop `provider` from the unauthenticated /health route (backend fingerprint to a network probe)?'
        - 'D2: drop audio_env, player_binary, last_playback.file/stderr from the authenticated WS health payload while keeping pid + daemon_version for daemon restart/doctor?'
        - 'D3: confirm daemon_version is acceptable over the authenticated channel only, never on unauthenticated /health?'
        - 'D4: sanitize/bound program-status reason/last_error (provider SDK text can embed URL/path), or use a closed reason-code set?'
        - 'D5: confirm hostname/username is never acceptable in any reply (they leak only via absolute paths today)?'
      prose: |
        Design/review only, no production code changed (write set: docs/). The invariant
        is stated as a predicate over every frame: hostPaths = binaryInventory = identity
        = empty, and version only over the authenticated channel.

        The single biggest finding is systemic, not one field: WireReply.error/fault
        (voxd/wire_reply.py:71) sanitizes the LOG record for injection but sends the wire
        message VERBATIM. Every str(OSError) fault reply therefore leaks an absolute path
        with the username -- 10 sites: cache_handlers.py:55,89; rec_handlers.py:103;
        record_handler.py:136,145; chunked_fetch.py:152,162; speech_handlers.py:212,217,229;
        play_handler.py:95. The fix is the pattern two handlers already use (voices, the
        fetch stat branch): logger.exception the detail, reply fault("operation failed").

        The four named leaks (cache_status.path, doctor detail, MCP status log path, the
        vox-log floor) are joined by record's audio-reply path, the WS health diagnostic
        block (player_binary/audio_env/last_playback.file+stderr), the play stderr fault,
        and program-status free-form reason/last_error sourced from str(exc). Ten fixes
        enumerated for beads; five operator decisions gate three of them. Full table and
        fix list in docs/wire-host-info-boundary.md.
    - mission: m-2026-07-26-019
      round: 2
      created_at: "2026-07-26T19:34:51Z"
      author: djb
      verdict: pass
      confidence: 0.9
      files_changed:
