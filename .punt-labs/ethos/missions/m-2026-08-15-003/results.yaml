      prose: |
        PR 3 of 3 for bead vox-w3f8.  Six commits on feat/vox-w3f8-observability
        off 33c0868; not pushed, no PR, no bd close (per contract).

        WHAT IT COVERS
        --------------
        Section 3.6 delivered: types_provider.ProviderReadiness is the wire shape
        both sides need, with a closed reason Literal AND a mirroring runtime
        frozenset AND a __post_init__ that refuses membership violations and
        the ready/reason biconditional.  The enumeration comment lives ABOVE
        the Literal, naming which ONE code path produces each of the five
        values.  A new reason must land in four places at once (Literal,
        frozenset, producer, render branches) or the runtime guard raises.

        Section 3.4 property proven DIRECTLY (not by inspection): a 32-
        combination exhaustive sweep asserts require rejects iff report reports
        not-ready, per provider, in both directions; detail matches str(exc)
        verbatim.

        D1 as amended: enable proposes THROUGH the daemon via provider_status,
        never by probing the enabling process environment.  Regression test
        sets ELEVENLABS_API_KEY + TTS_PROVIDER=openai in the client and has
        the fake daemon propose polly -- enable must write polly.  preferred
        is None writes nothing (no_ready_provider), voxd unreachable writes
        nothing (voxd_unavailable), already-declared provider is preserved
        (already_set).  Marker/guide/settings still land in every branch.

        mic:status: state-declared provider readiness fetched fresh (unconfigured
        case skips the daemon call; voxd_unavailable mirrors MusicStateView.
        unavailable).  model field lands for parity with what voxd will run
        with.  Doctor: F2 pointer target answers with per-provider daemon
        readiness; caller-env probe not reintroduced.

        ProviderReadiness moved from providers/credentials.py to types_provider
        (single source of truth, PY-RF-6 forward integration).  Credentials.py
        module_size and classes_per_module IMPROVED as a result.

        WHAT IT DOES NOT COVER
        ----------------------
        No live provider audio demo was run; contract forbade make install and
        vox daemon restart.  The one property that would fail behind the mock
        but pass in real life is a wire schema drift between the daemon
        ProviderStatusHandler frame and ProviderStatusPayload.from_wire; the
        round-trip is asserted at the type level (tests/test_types_provider.py)
        but not against the daemon actually shipping it.  Leader audio-demo
        gate closes that gap.

        check-coupling relaxations classified as Class B (real growth for the
        new wire paths); I did not audit the base blob to confirm none of the
        affected files was at the vox-orvz sentinel.  Every relaxation carries
        a per-file justification either way.

        cli_enablement.py and server_enablement.py were outside the contract
        write_set but are genuine consequences: EnableOutcome from enable()
        has to surface at both surfaces, which is the design's whole point of
        the D1 amendment.  Listed in files_changed above.

        Zero unauthorized suppressions added.  Suppression count 201 unchanged.
        4235 tests pass.  Six commits, one logical concern each; explicit paths
        staged, never git commit -a; vox.md not touched.
