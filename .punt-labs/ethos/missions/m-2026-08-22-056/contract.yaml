    - STTProvider Protocol defined generically (runtime_checkable, check_health method, matching TTSProvider's pattern but with partial/streaming transcript delivery and a confidence signal TTSProvider has no counterpart for) even though only ElevenLabs implements it -- FR-21. Ship this slice against a fake/scripted STTProvider; the real ElevenLabs-backed implementation is deferred with the providers/ follow-up above
