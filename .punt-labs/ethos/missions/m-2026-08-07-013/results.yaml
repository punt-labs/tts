      prose: |
        Both findings are in the core listen loop, code none of the prior
        three rounds touched.

        CRITICAL -- leg.py's _listen_once had an unguarded window between two
        HubUnavailableError-guarded calls to the exact same exception:
        rest.listener(...) and listener.subscribe(...) sat between the guarded
        self._rest_factory() and the guarded listener.listen(), uncovered.
        Widened the try/except to wrap all three build-then-subscribe calls in
        one block, since the method's own docstring already describes them as
        one step ("build one connection, subscribe"). Extracted the repeated
        "luxd is not running yet" string into a module constant
        (_HUB_UNAVAILABLE_MESSAGE) while touching this method, since it now
        appears in two branches of the same function. Added two tests: one
        makes rest.listener(...) raise and asserts _listen_once returns
        cleanly; the other does the same for listener.subscribe(...) for full
        coverage of every call now inside the widened guard.

        HIGH -- VoxPanelProgram.run() discarded the leg task's terminal
        exception unconditionally via asyncio.gather(leg, return_exceptions=
        True) with zero logging -- the safety net that should have caught the
        CRITICAL bug above (or any future one). run() now calls a new
        _log_if_crashed(leg) after the gather: it reads leg.exception()
        (safe -- the task is already done by this point), and if that raises
        CancelledError (the expected shutdown path) it returns silently;
        otherwise, a non-None exception is logged at ERROR with exc_info.
        program.py had no logger before this change -- added
        logging.getLogger(__name__), matching every other panel module.
        Added two tests: a genuine crash (RuntimeError, not CancelledError)
        produces exactly one ERROR record whose message contains "crashed";
        the existing cancellation-based test path produces zero log records,
        confirming the expected-shutdown path stays silent.

        Both fixes needed scoped .oo-baseline.json relaxations (leg.py's
        module_size, program.py's method count) with inline justifications
        citing this mission's findings; all metrics remain far under their
        absolute thresholds. Full test suite (uv run pytest) exits 0; the two
        new/changed test files were re-run 3x directly with no flakiness,
        given the async timing sensitivity of task-completion tests in this
        package.

        Commits landed on branch feat/vox-panel (two commits: source fixes,
        then tests). Did not push, open a PR, or touch branch/PR mechanics,
        per the mission's worker/leader split.
