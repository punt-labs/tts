      prose: |
        Phase 1.5 -- the music AND rec command-surface tidy -- is implemented in five
        commits on feat/vox-music-tidy, per the operator ruling that both groups
        collapse in one PR so the MCP surface is never uneven.

        Commit SHAs (each passes make check):
          dc2183e  PromptSet.single (one-track authored input)
          f40db77  single `music` tool + music_new PromptSet migration (base_prompt wire)
          6eaffa8  single `rec` tool
          b4efcb8  --json parity on every music and rec CLI verb (vox-cnak)
          2e97200  vox music on (stdin pool via isatty gate)

        The shape is uniform: `vox <group> <subcommand>` maps to the MCP tool
        `<group>` with its first argument `<subcommand>`. One MusicTool
        (server_music_tool.py, new) and one reshaped RecTool (server_audio_tools.py)
        each dispatch a Literal subcommand through an explicit ClassVar method table to
        per-verb handlers that read a frozen Args bundle (MusicArgs / RecArgs, PY-OO-3).
        Playback verbs drive the ProgramGateway seam, catalog/store verbs the
        CatalogGateway / VoxClientSync seams -- the same seams the CLI hits, so both
        surfaces share one code path. Seven music tools and five rec tools collapse to
        two mcp.tool registrations; MusicCatalogTools is deleted (folded in).

        music new sends the authored-input object on both surfaces: PromptSet.single
        built by the CLI and the MCP tool, its base carried as the base_prompt wire key,
        parsed daemon-side into a single-track PromptSet. The bare-string path is gone
        end to end.

        vox music on is the CLI twin of music(subcommand="on"): a wire-form pool piped
        on stdin (isatty gate, no --file flag), vibe from config via an injected seam, a
        malformed pool a clean CLI error. --json parity puts the three output flags on
        every music and rec verb, routed through one OutputFlags, so the flag parses
        after the subcommand as well as before it.

        No state-machine change, so no z-spec. The two out-of-write-set edits (client.py,
        hooks/suppress-output.sh) and the one design correction in open_questions are the
        only items needing the leader's eye before the PR opens. Not pushed; no PR; make
        install / daemon restart not run.
