        Music gains catalog authoring: MusicCli.new/get/remove route through a new
        CatalogGateway protocol + ClientCatalogGateway (mirrors ProgramGateway /
        ClientProgramGateway, since the write-set excludes program_gateway.py). new prints
        the bare album id and leaves the active Program untouched (D-5); remove refuses a
        playing album (D-2); get refuses a directory collision (D-1). play gained the bare
        <id> positional and keeps the --style/--vibe/--name tag radio (D-3).

        Forward integration, no shims: deleted the top-level record/play/fetch commands,
        the -o/--output option, _emit_record_locator, _atomic_write_bytes, vox play
        <localfile> (D-6), and the now-unused FETCH_FRAME_LIMIT_BYTES constant.

